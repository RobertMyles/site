name: Publish

# Builds the site with Quarto and deploys it to Netlify.
# - push to main: production deploy
# - pull request: preview deploy, link posted on the PR
#
# R is installed only so knitr can print R code blocks: execute.eval is
# false, and posts that do run code have their output committed in _freeze/,
# so no post's packages are needed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Bump this deliberately; nothing else upgrades Quarto.
  QUARTO_VERSION: 1.7.32

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          # Quarto comes from the pinned setup step below.
          install-quarto: false

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Render site
        run: quarto render

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Without these, netlify-cli waits minutes for an interactive login.
          : "${NETLIFY_AUTH_TOKEN:?Add the NETLIFY_AUTH_TOKEN repository secret}"
          : "${NETLIFY_SITE_ID:?Add the NETLIFY_SITE_ID repository secret}"

      - name: Deploy to Netlify (production)
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=_site --prod --message "${{ github.sha }}"

      - name: Deploy to Netlify (preview)
        if: github.event_name == 'pull_request'
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy --dir=_site \
            --alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }}" --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
